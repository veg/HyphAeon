[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "hyphaeon-core"
version = "0.4.0"
authors = [
  { name="Sergei L. Kosakovsky Pond", email="spond@temple.edu" },
]
description = "Aeon-Core: Shared bioinformatics infrastructure for Aeon-family packages"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.0.0",
    "biopython>=1.80",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.maturin]
python-source = "src"
manifest-path = "native/Cargo.toml"
module-name = "aeon_core._native"
bindings = "pyo3"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
"Homepage" = "https://github.com/veg/HyphAeon"
"Bug Tracker" = "https://github.com/veg/HyphAeon/issues"
