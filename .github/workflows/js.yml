# WHY THIS FILE EXISTS
#
# js/ is @veg/hyphaeon-js, a library of pure functions that mirror hyphaeon/*.py. Its tests replay
# fixtures/ (generated by scripts/gen_fixtures.py from the Python reference) and read models/
# (manifest + ONNX hashes), so a change to any of the three has to re-run the JS suite in the same
# pull request: that is the whole point of keeping the port in this repository (PLAN.md 5.5).
# Python tests live in tests.yml; keeping the two workflows separate means a JS failure never
# blocks an unrelated Python change and vice versa.

name: js

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'fixtures/**'
      - 'models/**'
      - '.github/workflows/js.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'fixtures/**'
      - 'models/**'
      - '.github/workflows/js.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      # No CDN or network at test time: everything comes from the lockfile.
      - name: Install
        run: npm ci

      - name: Test (vitest + fixture replay)
        run: npm test

      - name: Typecheck
        run: npm run typecheck
