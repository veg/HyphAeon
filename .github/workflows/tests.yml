name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-aeon-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install aeon-core and dev dependencies
        run: pip install -e aeon-core/[dev,tn93]

      - name: Run aeon-core tests
        run: python -m pytest aeon-core/tests/ -v

  test-hyphaeon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install aeon-core, hyphaeon and dev dependencies
        run: pip install -e aeon-core/ -e hyphaeon/[dev,tn93]

      - name: Run hyphaeon tests
        run: python -m pytest hyphaeon/tests/ -v

  test-chronaeon:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install aeon-core, chronaeon and dev dependencies
        run: pip install -e aeon-core/ -e chronaeon/[dev,tn93]

      - name: Run chronaeon tests
        run: python -m pytest chronaeon/tests/ -v

  # The rhizaeon/trace50 Python packages are thin shims over compiled
  # Rust extensions, so their tests need a Rust toolchain to build the
  # wheel via maturin. One Python version is enough — this job guards
  # the CLI contract (flags, exit codes, version string), not Python
  # API surface.
  test-native-clis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install rhizaeon and trace50 (maturin builds the extensions)
        run: pip install rhizaeon/ trace50/ pytest
      - name: Run native CLI contract tests
        run: python -m pytest rhizaeon/tests/ trace50/tests/ -v
