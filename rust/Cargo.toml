[workspace]
members = [
    "libs/aeon-autoclock",
    "libs/aeon-cli-utils",
    "libs/aeon-manifold",
    "../aeon-core/native",
    "../rhizaeon/native",
    "../trace50/native",
    "rhizaeon/crates/rhizaeon",
    "rhizaeon/crates/rhizaeon-tools",
    "rhizaeon/crates/rhizaeon-wasm",
    "trace-5.0/crates/trace50",
    "trace-5.0/crates/trace50-wasm",
]
resolver = "2"

[workspace.dependencies]
aeon-autoclock = { path = "libs/aeon-autoclock", version = "0.1.0" }
aeon-cli-utils = { path = "libs/aeon-cli-utils", version = "0.1.0" }
aeon-manifold = { path = "libs/aeon-manifold", version = "0.1.0" }
rhizaeon = { path = "rhizaeon/crates/rhizaeon", version = "0.1.3" }
trace50 = { path = "trace-5.0/crates/trace50", version = "5.0.0" }
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pyo3 = { version = "0.23", features = ["extension-module"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# NOTE: no panic = "abort" — the workspace builds PyO3 cdylib extensions
# (aeon-core/rhizaeon/trace50 native crates) loaded into a Python process;
# abort would kill the interpreter instead of surfacing a Python exception.
# wasm32-unknown-unknown aborts on panic regardless, so wasm is unaffected.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
