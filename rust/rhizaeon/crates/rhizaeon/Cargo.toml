[package]
name = "rhizaeon"
version = "0.1.4"
edition = "2021"
authors = ["Sergei L. Kosakovsky Pond", "Antigravity AI Engine"]
description = "High-performance, zero-dependency algorithmic kernel for RhizAeon PA-FF (v2.1)"
license = "MIT"
repository = "https://github.com/veg/HyphAeon"
homepage = "https://github.com/veg/HyphAeon"

# User-facing CLI ships via the `rhizaeon` Python package (rhizaeon/native),
# not as a cargo bin — keeps the lib clap-free for the wasm build.
[dependencies]
aeon-manifold.workspace = true
serde.workspace = true
serde_json.workspace = true
